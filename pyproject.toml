[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "bootstrap_pi_inky.sh", "display_inky.py"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "raise SystemExit",
]
