[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litclock"
version = "0.1.0"
description = "Literary clock: harvest time phrases from Project Gutenberg and render a matching quote on an Inky Impression eInk display."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]
pi = ["inky", "gpiozero"]

[tool.setuptools]
py-modules = [
    "buckets",
    "bucket_coverage",
    "clean_display_quotes",
    "display_inky",
    "enrich_metadata",
    "fix_substring_time_matches",
    "gutenberg_time_miner",
    "import_targeted_hits",
    "inky_buttons",
    "jsonl_io",
    "litclock_health",
    "merge_candidates",
    "pick_quote",
    "quality_filter",
    "render_quote",
    "run_clock",
    "target_sparse_buckets",
    "web_server",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "bootstrap_pi_inky.sh", "display_inky.py"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "raise SystemExit",
]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]  # Line too long (handled separately if needed)
