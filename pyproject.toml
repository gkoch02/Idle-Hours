[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idle-hours"
# Single source of truth for the release version. `idle-hours --version` reads
# it back through importlib.metadata, so this literal is what the installed
# CLI, the wheel filename, and `pip show idle-hours` all report. Keep it in
# lockstep with the git tag: the CI `release-version` job fails a tag build
# whose `vX.Y.Z` ref does not match this value.
version = "2.5.0"
description = "Idle Hours: a literary clock that harvests time phrases from Project Gutenberg and renders a matching quote on an Inky Impression eInk display."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pytest-xdist", "ruff"]
pi = ["inky", "gpiozero"]

[project.scripts]
# Single umbrella entry point — `idle-hours <subcommand>` dispatches to the
# matching script's main(). Defined here so `pip install .` registers the
# console script in the bin/ directory of the active environment.
idle-hours = "idle_hours.idle_hours_cli:main"

[tool.setuptools.packages.find]
# Discover the ``idle_hours/`` package (and any future subpackage under it).
# Switched from the older ``py-modules = [...]`` flat-list form so the wheel
# can carry ``web/`` / ``assets/`` / ``fonts/`` as ``package-data`` (below).
include = ["idle_hours*"]

[tool.setuptools.package-data]
# Ship the static assets the renderer / curator UI / corpus need at runtime
# inside the wheel itself. Without this, ``pip install idle-hours`` produced
# a CLI that 404'd the curator UI, fell back to bitmap fonts, and couldn't
# find the prebuilt corpus — only ``pip install -e .`` from a clone worked.
idle_hours = ["assets/**/*", "fonts/**/*", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["idle_hours"]
# display_inky.py stays in coverage: its module-level defaults + resolve_saturation
# + main() retry/backoff logic are exercised by tests/test_display_inky.py with
# the hardware call (_push_to_panel, which imports the Pimoroni Inky library) mocked out.
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    # Keep coverage.py's default pragma marker when overriding this list —
    # without it, `# pragma: no cover` comments are silently ignored and
    # hardware-only branches like ``display_inky._push_to_panel`` inflate
    # the "missing lines" report.
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise SystemExit",
]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]  # Line too long (handled separately if needed)
