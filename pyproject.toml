[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litclock"
version = "0.1.0"
description = "Literary clock: harvest time phrases from Project Gutenberg and render a matching quote on an Inky Impression eInk display."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pytest-xdist", "ruff"]
pi = ["inky", "gpiozero"]

[tool.setuptools]
# Keep this list in sync with the top-level *.py files in the repo root.
# tests/test_packaging.py::test_py_modules_covers_top_level_modules enforces
# the invariant — a module that exists on disk but is missing here will
# silently break ``pip install .`` (the installed wheel won't contain it).
py-modules = [
    "apply_content_overrides",
    "atomic_io",
    "bake_quote_database",
    "bucket_coverage",
    "buckets",
    "clean_display_quotes",
    "contact_sheet",
    "display_inky",
    "enrich_metadata",
    "fix_legacy_buckets",
    "fix_substring_time_matches",
    "gutenberg_time_miner",
    "import_targeted_hits",
    "inky_buttons",
    "jsonl_io",
    "litclock_health",
    "merge_candidates",
    "pick_quote",
    "pidfile",
    "probe_buttons",
    "quality_filter",
    "render_quote",
    "run_clock",
    "runtime_actions",
    "runtime_config",
    "runtime_log",
    "runtime_quiet",
    "runtime_state",
    "runtime_store",
    "runtime_telemetry",
    "runtime_theme",
    "sd_notify",
    "target_sparse_buckets",
    "web_server",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["."]
# display_inky.py stays in coverage: its module-level defaults + resolve_saturation
# + main() retry/backoff logic are exercised by tests/test_display_inky.py with
# the hardware call (_push_to_panel, which imports the Pimoroni Inky library) mocked out.
omit = ["tests/*", "bootstrap_pi_inky.sh"]

[tool.coverage.report]
exclude_lines = [
    # Keep coverage.py's default pragma marker when overriding this list —
    # without it, `# pragma: no cover` comments are silently ignored and
    # hardware-only branches like ``display_inky._push_to_panel`` inflate
    # the "missing lines" report.
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise SystemExit",
]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]  # Line too long (handled separately if needed)
