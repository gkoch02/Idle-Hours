[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idle-hours"
# Single source of truth for the release version. `idle-hours --version` reads
# it back through importlib.metadata, so this literal is what the installed
# CLI, the wheel filename, and `pip show idle-hours` all report. Keep it in
# lockstep with the git tag: the CI `release-version` job fails a tag build
# whose `vX.Y.Z` ref does not match this value.
version = "2.5.0"
description = "Idle Hours: a literary clock that harvests time phrases from Project Gutenberg and renders a matching quote on an Inky Impression eInk display."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Floor, not a pin. The newest Pillow API the renderer calls is the
    # ``Image.Dither`` enum (``Image.Dither.FLOYDSTEINBERG``, added in 9.1.0);
    # 9.3.0 is the oldest release the suite is verified green on under this
    # project's ``requires-python >= 3.11``, so that is what we declare rather
    # than an untested 9.1. Deliberately NOT raised to 11.1 (where
    # ``get_flattened_data`` lands): no production or test code calls it — the
    # image assertions use ``getcolors`` / ``tobytes`` / ``histogram``, stable
    # across every Pillow release — and an 11.1 floor would lock out the distro
    # Pillow on Raspberry Pi OS bookworm (9.4), which is the appliance's own
    # deployment target.
    "Pillow>=9.3",
]

[project.optional-dependencies]
# ``pyyaml`` is a test-only dependency: tests/test_ci_required_checks.py parses
# .github/workflows/ci.yml to fence it against the required-status-check list
# in .github/rulesets/main-branch.json. Imported hard rather than through
# ``importorskip`` so a missing parser fails that fence instead of skipping it.
dev = ["pytest", "pytest-cov", "pytest-xdist", "pyyaml", "ruff"]
pi = ["inky", "gpiozero"]

[project.scripts]
# Single umbrella entry point — `idle-hours <subcommand>` dispatches to the
# matching script's main(). Defined here so `pip install .` registers the
# console script in the bin/ directory of the active environment.
idle-hours = "idle_hours.idle_hours_cli:main"

[tool.setuptools.packages.find]
# Discover the ``idle_hours/`` package (and any future subpackage under it).
# Switched from the older ``py-modules = [...]`` flat-list form so the wheel
# can carry ``web/`` / ``assets/`` / ``fonts/`` as ``package-data`` (below).
include = ["idle_hours*"]

[tool.setuptools.package-data]
# Ship the static assets the renderer / curator UI / corpus need at runtime
# inside the wheel itself. Without this, ``pip install idle-hours`` produced
# a CLI that 404'd the curator UI, fell back to bitmap fonts, and couldn't
# find the prebuilt corpus — only ``pip install -e .`` from a clone worked.
idle_hours = ["assets/**/*", "fonts/**/*", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    # Third-party DeprecationWarnings are noise for this suite; the broad
    # ignore stays.
    "ignore::DeprecationWarning",
    # …but not for Pillow's own removal notices. The blanket ignore above let
    # 26 ``Image.getdata()`` call sites accrue silently for a year against a
    # Pillow 14 removal (issue #204). Pillow words every one of these the same
    # way ("… is deprecated and will be removed in Pillow N (date)"), so
    # matching that message turns the next one into a failing test on the day
    # it is introduced. Later filters win in pytest, so this overrides the
    # ignore above for exactly these warnings.
    "error:.*will be removed in Pillow.*:DeprecationWarning",
]

[tool.coverage.run]
source = ["idle_hours"]
# display_inky.py stays in coverage: its module-level defaults + resolve_saturation
# + main() retry/backoff logic are exercised by tests/test_display_inky.py with
# the hardware call (_push_to_panel, which imports the Pimoroni Inky library) mocked out.
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    # Keep coverage.py's default pragma marker when overriding this list —
    # without it, `# pragma: no cover` comments are silently ignored and
    # hardware-only branches like ``display_inky._push_to_panel`` inflate
    # the "missing lines" report.
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise SystemExit",
]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]  # Line too long (handled separately if needed)
