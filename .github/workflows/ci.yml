name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check --output-format=github .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Both interpreter legs run plain pytest so the matrix finishes at the
      # same speed. Coverage + the --cov-fail-under gate live in the separate
      # ``coverage`` job below — branch coverage (added so a dead ``except``
      # branch shows up as a drop) has measurable sysmon overhead and was
      # serialising the 3.12 leg behind ~2-3 extra minutes of tracer work.
      - name: Run tests
        run: pytest -n auto --dist loadscope --ignore=tests/test_render_golden.py

      - name: End-to-end --once smoke (verifies rendered PNG decodes)
        # One Python version is enough — the existing test job already exercises
        # ``run_clock --once`` via subprocess; this step adds an
        # ``Image.verify()`` check so a truncated / partially-snapped PNG
        # surfaces immediately instead of waiting for someone to look at the
        # appliance. ``--skip-preflight`` is required because the CI runner
        # has no display script on the configured path.
        if: matrix.python-version == '3.12'
        run: |
          python -m idle_hours.run_clock --once --skip-preflight --buttons-off --quiet-off \
            --history-path "" --state-path "" --pidfile "" --telemetry-path "" \
            --mode production
          python -c "from PIL import Image; im = Image.open('output/current.png'); im.verify(); im.close(); print('PNG OK')"

  coverage:
    # Coverage runs in its own job so the ``test`` matrix isn't gated on tracer
    # overhead. ``--cov-branch`` measures both arms of every ``if`` so a refactor
    # that silently skips one branch (e.g. an ``except Exception`` that was once
    # reachable, now dead) shows up as a coverage drop. ``--cov-fail-under``
    # locks today's combined line+branch number so a regression below that
    # floor blocks the merge — without this gate, coverage.xml is uploaded
    # as an artifact but nothing acts on it. Python 3.12 + COVERAGE_CORE=sysmon
    # uses sys.monitoring (PEP 669) for the lightest available tracer.
    #
    # push-only (main): the tracer makes this the slowest job in the run
    # (~4 min), so it's skipped on pull_request to keep PR feedback fast.
    # The gate still catches regressions post-merge on main.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        env:
          COVERAGE_CORE: sysmon
        run: pytest -n auto --dist loadscope --ignore=tests/test_render_golden.py --cov=idle_hours --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=95

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-3.12
          path: coverage.xml
          if-no-files-found: error

  golden-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run golden render tests
        run: pytest tests/test_render_golden.py -n auto --dist worksteal

  package-build:
    # Builds a wheel + sdist from pyproject.toml and installs the wheel into
    # a fresh venv with NO extras (no ``[dev]``, no ``[pi]``). Then imports
    # every production module from the installed wheel, confirms the
    # ``idle_hours/`` package data (assets / fonts / web) shipped, and runs
    # ``python -m idle_hours.run_clock --help`` as a canonical entrypoint
    # smoke. This catches install-time failure modes that the rest of CI
    # (which uses ``pip install -e .``) cannot see:
    #
    #   1. Modules missing from the package (``packages.find`` misconfig).
    #      The wheel ships exactly what setuptools picked up; a module that
    #      slipped out of the package directory would crash on first import.
    #   2. ``package-data`` missing or wrong patterns — without the bundled
    #      assets the curator UI 404s, the renderer falls back to bitmap
    #      fonts, and the corpus can't load. The data-file check below is
    #      the single guard against that regression.
    #   3. Optional-dep leakage at module import time — if any module hoists
    #      an ``import gpiozero`` / ``import inky`` from a function body to
    #      the top of the file, the wheel becomes unusable on non-Pi hosts.
    #   4. Broken ``__main__`` wiring — ``python -m idle_hours.run_clock``
    #      only resolves against installed top-level modules, not the
    #      source checkout.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install built wheel into clean venv (no extras)
        run: |
          python -m venv /tmp/whlcheck
          /tmp/whlcheck/bin/pip install --upgrade pip
          /tmp/whlcheck/bin/pip install dist/*.whl

      - name: Import every production module from the installed wheel
        # Run from /tmp, not the repo root: when Python starts, ``sys.path[0]``
        # is the CWD, so a step run from the checkout would resolve
        # ``idle_hours`` against ``./idle_hours/`` BEFORE the installed wheel —
        # defeating the whole point of this job. ``cd /tmp`` forces imports
        # to come from site-packages.
        working-directory: /tmp
        run: |
          /tmp/whlcheck/bin/python - <<'PY'
          import importlib
          import sys
          from pathlib import Path

          MODULES = [
              "apply_content_overrides", "atomic_io", "bake_quote_database",
              "bucket_coverage", "buckets", "clean_display_quotes",
              "contact_sheet", "display_inky", "enrich_metadata",
              "fix_legacy_buckets", "fix_substring_time_matches",
              "gutenberg_time_miner", "idle_hours_cli", "idle_hours_health",
              "import_targeted_hits", "inky_buttons",
              "jsonl_io", "merge_candidates", "pick_quote",
              "pidfile", "probe_buttons", "quality_filter", "render_quote",
              "run_clock", "runtime_actions", "runtime_config", "runtime_log",
              "runtime_quiet", "runtime_state", "runtime_store",
              "runtime_telemetry", "runtime_theme", "runtime_webhook",
              "sd_notify", "target_sparse_buckets", "theme_names",
              "web_server",
          ]
          site_packages = "/tmp/whlcheck/lib"
          import idle_hours
          package_root = Path(idle_hours.__file__).resolve().parent
          for name in MODULES:
              mod = importlib.import_module(f"idle_hours.{name}")
              # Defence in depth: confirm the import resolved to the installed
              # wheel, not a stray copy on sys.path. If this assertion ever
              # fires the working-directory above is wrong.
              assert mod.__file__ and mod.__file__.startswith(site_packages), (
                  f"{name!r} resolved to {mod.__file__!r}, "
                  f"expected something under {site_packages!r}"
              )

          # package-data invariants — the wheel must ship the bundled fonts,
          # corpus, and curator-UI assets next to the Python modules so a
          # bare ``pip install`` produces a working install.
          for sub in ("assets", "fonts", "web"):
              path = package_root / sub
              assert path.is_dir(), (
                  f"package-data {sub!r} missing from installed wheel at "
                  f"{path}. Check [tool.setuptools.package-data] in pyproject.toml."
              )
          assert (package_root / "assets" / "quote_database.jsonl").exists(), (
              "baked corpus missing from wheel — runtime picker will fail."
          )
          assert (package_root / "web" / "index.html").exists(), (
              "curator UI missing from wheel — /api endpoints would 404."
          )

          forbidden = ("gpiozero", "inky", "RPi")
          leaked = sorted(m for m in sys.modules if m.split(".", 1)[0] in forbidden)
          assert leaked == [], f"hardware deps leaked into sys.modules: {leaked}"
          print(f"OK: {len(MODULES)} modules importable from installed wheel; assets present; no leakage")
          PY

      - name: Smoke-test installed entrypoint
        # Same ``working-directory`` reasoning as above — without it,
        # ``python -m idle_hours.run_clock`` would resolve against the source
        # checkout instead of the wheel.
        working-directory: /tmp
        run: /tmp/whlcheck/bin/python -m idle_hours.run_clock --help

      - name: Smoke-test console script
        # The wheel registers ``idle-hours`` via [project.scripts]; verify
        # the entry-point wires through to the SUBCOMMANDS dispatcher.
        working-directory: /tmp
        run: /tmp/whlcheck/bin/idle-hours --help
