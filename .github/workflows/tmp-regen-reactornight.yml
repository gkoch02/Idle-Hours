# Temporary: regenerates the reactornight goldens and README preview on the CI
# runner (macOS renders differ). Deleted in the commit that lands its output.
name: tmp-regen-reactornight
on:
  push:
    branches: [claude/reactornight-theme]
  workflow_dispatch:
jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: UPDATE_RENDER_GOLDEN=1 pytest tests/test_render_golden.py -k reactornight
      - run: python3 scripts/generate_theme_previews.py --theme reactornight
      - uses: actions/upload-artifact@v4
        with:
          name: regen
          path: |
            tests/golden/renderer/standard_reactornight_production.png
            tests/golden/renderer/sleep_reactornight.png
            idle_hours/assets/previews/reactornight.png
