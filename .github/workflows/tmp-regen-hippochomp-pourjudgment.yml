# Temporary: regenerates the hippochomp / pourjudgment goldens and README
# previews on the CI runner (macOS renders differ). Deleted in the commit that
# lands its output.
name: tmp-regen-hippochomp-pourjudgment
on:
  push:
    branches: [claude/hippochomp-pourjudgment-themes]
  workflow_dispatch:
jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: UPDATE_RENDER_GOLDEN=1 pytest tests/test_render_golden.py -k "hippochomp or pourjudgment"
      - run: |
          python3 scripts/generate_theme_previews.py --theme hippochomp
          python3 scripts/generate_theme_previews.py --theme pourjudgment
      - uses: actions/upload-artifact@v4
        with:
          name: regen
          path: |
            tests/golden/renderer/standard_hippochomp_production.png
            tests/golden/renderer/standard_pourjudgment_production.png
            idle_hours/assets/previews/hippochomp.png
            idle_hours/assets/previews/pourjudgment.png
